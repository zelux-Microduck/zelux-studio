name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node --experimental-default-type=module tools/test-imu-management.mjs
      - run: node --experimental-default-type=module tools/test-imu-management-dom.mjs
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with: {name: studio-package, path: dist/}
